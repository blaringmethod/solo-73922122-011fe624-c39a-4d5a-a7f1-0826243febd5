<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}名录复核抽样估计{% endblock %}</title>
  <style>
    :root { --line:#d8dde6; --bg:#f5f7fa; --blue:#1f5fa8; --red:#b3261e; --green:#1e7d32; --amber:#9a6700; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1c2430; }
    header { background:#16324f; color:#fff; padding:14px 24px; }
    header h1 { margin:0; font-size:19px; font-weight:600; }
    nav { background:#1f4263; padding:0 24px; display:flex; flex-wrap:wrap; gap:4px; }
    nav a { color:#cdd9e8; text-decoration:none; padding:11px 14px; font-size:14px; }
    nav a:hover { background:#2a5580; color:#fff; }
    main { max-width:1080px; margin:22px auto; padding:0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px 22px; margin-bottom:18px; }
    h2 { margin-top:0; font-size:17px; }
    table { border-collapse:collapse; width:100%; font-size:14px; }
    th,td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
    th { background:#eef2f7; font-weight:600; }
    .flash { border-radius:6px; padding:11px 15px; margin-bottom:14px; font-size:14px; border:1px solid; }
    .flash-msg { background:#e8f1fb; border-color:#b7d3ef; color:#174a7c; }
    .flash-err { background:#fbe9e7; border-color:#f0b8b3; color:var(--red); }
    .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
    .b-error { background:#fbe9e7; color:var(--red); }
    .b-ok { background:#e6f4ea; color:var(--green); }
    .b-pending { background:#fff4e0; color:var(--amber); }
    .b-lock { background:#e8eaed; color:#444; }
    .b-info { background:#e8f1fb; color:var(--blue); }
    .muted { color:#66737f; font-size:13px; }
    textarea, input[type=text] { width:100%; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; padding:9px; border:1px solid var(--line); border-radius:6px; }
    textarea { min-height:150px; }
    label { font-weight:600; font-size:14px; display:block; margin:12px 0 5px; }
    button, .btn { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:9px 18px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
    button.secondary, .btn.secondary { background:#5b6b7c; }
    button.danger { background:var(--red); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    form.inline { display:inline; }
    .kv { display:grid; grid-template-columns:160px 1fr; gap:6px 14px; font-size:14px; }
    .kv dt { color:#5a6a78; font-weight:600; }
    .kv dd { margin:0; }
    .big { font-size:26px; font-weight:700; color:var(--blue); }
    .na { color:var(--red); font-weight:700; }
    .radio-row label { display:inline; font-weight:400; margin-right:14px; }
    .note-form input { max-width:320px; }
    @media (max-width:760px){ .grid2{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <header><h1>馆藏著录复核 · 双组抽样与 Horvitz–Thompson 估计</h1></header>
  <nav>
    <a href="{{ url_for('index') }}">总览</a>
    <a href="{{ url_for('import_page') }}">导入与锁定</a>
    <a href="{{ url_for('register', grp='A') }}">甲组登记</a>
    <a href="{{ url_for('register', grp='B') }}">乙组登记</a>
    <a href="{{ url_for('review') }}">待核清单</a>
    <a href="{{ url_for('results') }}">出数</a>
    <a href="{{ url_for('audit') }}">更正审计</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, m in messages %}
        <div class="flash {{ 'flash-err' if category == 'error' else 'flash-msg' }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
